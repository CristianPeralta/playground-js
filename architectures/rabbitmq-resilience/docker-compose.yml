services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672' # web UI
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  producer:
    build: .
    # command: npm run producer
    depends_on:
      - rabbitmq
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
  consumer:
    build: .
    command: npm run consumer
    depends_on:
      - rabbitmq
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
  dlq-consumer:
    build: .
    command: npm run dlq-consumer
    depends_on:
      - rabbitmq
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
volumes:
  rabbitmq-data:
