version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
  auth:
    build: ./auth
    ports:
      - "3001:3001"
    env_file:
      - ./auth/.env
    depends_on:
      - rabbitmq
  payments:
    build: ./payments
    ports:
      - "3002:3002"
    env_file:
      - ./payments/.env
    depends_on:
      - rabbitmq
  notifications:
    build: ./notifications
    ports:
      - "3003:3003"
    env_file:
      - ./notifications/.env
    depends_on:
      - rabbitmq
